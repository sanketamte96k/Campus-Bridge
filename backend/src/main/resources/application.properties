spring.application.name=campusbridge-backend

# Database Configuration (Credentials must be supplied via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusbridge}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (HMAC-SHA256 minimum 256-bit key required)
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds = 86400000
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Server Configuration
server.port=${PORT:8080}

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

