spring.application.name=campusbridge-backend

# Database Configuration (Test database credentials must come from environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusbridge}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Obviously fake test-only JWT configuration (never used in production)
jwt.secret=obviously-fake-test-only-jwt-secret-key-that-is-at-least-32-characters-long
jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Server Configuration
server.port=${PORT:8080}

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
