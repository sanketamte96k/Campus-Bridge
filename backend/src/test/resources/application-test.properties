# Database Configuration for Test Profile (layers on top of application.properties)
# Always targets the isolated campusbridge_test database, never the dev/production campusbridge database
spring.datasource.url=${TEST_DB_URL:${DB_TEST_URL:jdbc:mysql://localhost:3306/campusbridge_test}}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:campusbridge_user}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD}}

# Obviously fake test-only JWT configuration (never used in production)
jwt.secret=obviously-fake-test-only-jwt-secret-key-that-is-at-least-32-characters-long
